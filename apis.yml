aid: withings
name: Withings
description: Withings is a connected health device platform providing a REST API for
  accessing data from smart scales, blood pressure monitors, sleep trackers, thermometers,
  and fitness watches. The API uses OAuth2 for authentication and provides access
  to a wide range of health biomarkers including body composition, cardiovascular
  data, sleep metrics, activity tracking, and clinical-grade measurements. Partners
  and developers can integrate Withings health data into their applications for remote
  patient monitoring, wellness platforms, and research applications.
