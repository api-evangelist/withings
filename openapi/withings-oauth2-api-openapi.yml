    post:
      tags:
      - OAuth2
      description: 'This service allows you to get a list of all users that have authorized your application to fetch their data.


        **This service is limited to partners who are integrating with Withings Pro solutions. This service will only work for partners having signed a contract with Withings.**'
      summary: OAuth 2.0 - Get user list
      operationId: oauth2-listusers
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
        description: Must take the string value ```listusers```.
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your ```Client ID```.
      - name: nonce
        in: query
        required: true
        schema:
          type: string
        description: A random token used to prevent replay attacks (Cf. [Signature v2 - Getnonce](#operation/signaturev2-getnonce)).
      - name: signature
        in: query
        required: true
        schema:
          type: string
        description: Hash of params (Cf. [Signature hash protocol](/developer-guide/v3/get-access/sign-your-requests)).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: When a first call returns ```more:true``` and ```offset:XX```, set value ```XX``` in this parameter to retrieve next available rows.
      responses:
        200:
          description: ' (Click to unfold)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Response status. See <a href='#section/Response-status'>Status</a> section for details.
                  body:
                    type: object
                    description: Response data.
                    properties:
                      hash_userid:
                        type: string
                        example: b1e4ea9c8bf584c8210ff308b19d656e15e9a074cd69178f833f687b95d8a2b5
                      userid:
                        type: integer
                        description: The id of the user.
                        example: 2685485
                      email:
                        type: string
                        description: User's email address
                        example: example@mailprovider.com
                      fully_owned:
                        type: boolean
                        description: Whether or not this user has been created by your oauth2 application. Having created the account gives your application additional rights on this account, such as automatically granted authorizations and access to the retrieve tokens webservice.
                      more:
                        type: boolean
                        description: To know if there is more data to fetch or not.
                      offset:
                        type: integer
                        description: Offset to use to retrieve the next data.
