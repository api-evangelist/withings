components:
  schemas:
    survey_list_users:
      type: object
      properties:
        userid:
          type: integer
          description: The id of the user.
          example: 102
        activation_date:
          type: integer
          description: Timestamp when the survey has been activated for the user
          format: timestamp
          example: 1712008389
    survey_list:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Survey name
        description:
          type: string
          example: Survey description
        trigger_type:
          type: integer
          example: 1
        trigger_conditions:
          type: array
        category:
          type: integer
          example: 1
        answers_type:
          type: integer
          example: 1
