  'https://wbsapi.withings.net/v2/survey   ':
    post:
      tags:
      - survey
      description: ''
      summary: Survey v2  - List
      operationId: surveyv2-list
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
        description: Service action name. Must take the string value ```list```.
      - name: signature
        in: query
        required: true
        schema:
          type: string
