              type: integer
              description: '*Available for all categories except Multi-sport, Breathing excercises*<br><br>Active calories burned manually entered by user (in Kcal). *(Use ''data_fields'' to request this data.)*'
            manual_distance:
              type: integer
              description: '*Available for all categories except Multi-sport, Breathing excercises*<br><br>Distance travelled manually entered by user (in meters). *(Use ''data_fields'' to request this data.)*'
            manual_intensity:
              type: integer
              description: '*Available for all categories except Multi-sport, Breathing excercises*<br><br>Intensity of the workout, from 0 to 100, entered by the user. If the user didn''t manually give the intensity of his workout, the value will be 0.'
            pause_duration:
              type: integer
              description: '*Available for all categories except Multi-sport, Breathing excercises*<br><br>Total pause time in second filled by user'
            pool_laps:
              type: integer
              description: '*Available only for Swimming*<br><br>Number of pool laps. *(Use ''data_fields'' to request this data.)*'
            pool_length:
              type: integer
              description: '*Available only for Swimming*<br><br>Length of the pool. *(Use ''data_fields'' to request this data.)*'
            spo2_average:
              type: integer
              description: '*Available for all categories except Multi-sport, Breathing excercises*<br><br>Average percent of SpO2 percent value during a workout'
            steps:
              type: integer
              description: '*Available for all categories except Swimming, Multi-sport, Breathing excercises*<br><br>Number of steps. *(Use ''data_fields'' to request this data.)*'
            strokes:
              type: integer
              description: '*Available only for Swimming*<br><br>Number of strokes. *(Use ''data_fields'' to request this data.)*'
    measuregrp_object:
      type: object
      properties:
        grpid:
          type: integer
          description: Unique identifier of the measure group.
          format: int64
          example: 12
        attrib:
          type: integer
          description: 'The way the measure was attributed to the user:



            | Value | Description|

            |---|---|

            |0 | The measuregroup has been captured by a device and is known to belong to this user (and is not ambiguous)|

            |1 | The measuregroup has been captured by a device but may belong to other users as well as this one (it is ambiguous)|

            |2 | The measuregroup has been entered manually for this particular user|

            |4 | The measuregroup has been entered manually during user creation (and may not be accurate)|

            |5 | Measure auto, it''s only for the Blood Pressure Monitor. This device can make many measures and computed the best value|

            |7 | Measure confirmed. You can get this value if the user confirmed a detected activity|

            |8 | Same as attrib 0|

            |15 | The measure has been performed in specific guided conditions. Apply to Nerve Health Score|

            '
          example: 1
        date:
          type: integer
          description: UNIX timestamp when measures were taken.
          format: timestamp
          example: 1594245600
        created:
          type: integer
          description: UNIX timestamp when measures were stored.
          format: timestamp
          example: 1594246600
        modified:
          type: integer
          description: UNIX timestamp when measures were last updated.
          format: timestamp
          example: 1594257200
        category:
          type: integer
          description: Category for the measures in the group (see category input parameter).
          example: 1594257200
        deviceid:
          type: string
          description: 'ID of device that tracked the data. To retrieve information about this device, refer to : <a href=''/api-reference/#operation/userv2-getdevice''>User v2 - Getdevice</a>.'
