      x-codeSamples:
      - lang: PHP
        source: "<?php\n\n$ch = curl_init();\n\ncurl_setopt($ch, CURLOPT_URL, \"https://wbsapi.withings.net/v2/dropshipment    \");\n\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, TRUE);\n\ncurl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query([ \n\t'action' => 'update',\n\t'client_id' => 'client_id',\n\t'signature' => 'signature',\n\t'nonce' => 'string',\n\t'order_id' => 'string',\n\t'order' => 'order'\n]));\n\n$rsp = curl_exec($ch);\ncurl_close($ch);\n\nvar_dump($rsp);\n\n?>"
      - lang: CURL
        source: curl --data "action=update&client_id=client_id&signature=signature&nonce=string&order_id=string&order=order" 'https://wbsapi.withings.net/v2/dropshipment    '
components:
  schemas:
    dropshipment_get_order_status_product_object:
      type: object
      properties:
        ean:
          type: string
          description: EAN of the product.
          example: '3700546702518'
        partner_ref:
          type: string
          example: REF-12345
        devices:
          type: array
          items:
            $ref: '#/components/schemas/dropshipment_get_order_status_product_device_object'
        quantity:
          type: integer
          description: Quantity of products.
          example: 3
        mac_addresses:
          type: array
          description: List of device MAC addresses. *(Only if order has been shipped)*
          example:
          - 00:24:e4:xx:xx:xx
          - 00:24:e4:xx:xx:xx
          - 00:24:e4:xx:xx:xx
          items:
            type: macaddress
        hash_deviceids:
          type: array
          example:
          - 892359876fd8805ac45bab078c4828692f0276b1
          - a1b2c3d4e5f6
        serial_numbers:
          type: array
          example:
          - SN-001122334455
          - SN-001122334456
    dropshipment_create_order_object:
      type: object
      properties:
        order_id:
          type: string
          description: Withings generated identifier used to track your order.
          example: D12345678
        customer_ref_id:
          type: string
          description: Random identifier you must provide in input parameters. It is used to track your order and must be unique.
          example: MOUVEMENTREFERENCE12345678
        dropshipmentorderid:
          type: string
          description: Unique identifier of the dropshipment order.
          example: '32948634'
        status:
          type: string
          description: 'Status of the order. Value can be:



            | Value|

            |---|

            |CREATED|

            |ADDRESS VERIFICATION|

            |ADDRESS ERROR|

            |VERIFIED|

            |PROCESSING|

            |FAILED|

            |OPEN|

            |SHIPPED|

            |TRASHED|

            |BACKHOLD|

            '
          example: ADDRESS VERIFICATION
        products:
          type: array
          items:
            $ref: '#/components/schemas/dropshipment_create_order_product_object'
    dropshipment_get_order_status_object:
      type: object
      properties:
        order_id:
          type: string
          description: Withings generated identifier used to track your order.
          example: D12345678
        customer_ref_id:
          type: string
          description: Random identifier you must provide in input parameters. It is used to track your order and must be unique.
          example: MOUVEMENTREFERENCE12345678
        status:
          type: string
          description: 'Status of the order. Value can be:



            | Value|

            |---|

            |CREATED|

            |ADDRESS VERIFICATION|

            |ADDRESS ERROR|

            |VERIFIED|

            |PROCESSING|

            |FAILED|

            |OPEN|

            |SHIPPED|

            |TRASHED|

            |BACKHOLD|

            '
          example: SHIPPED
        products:
          type: array
          items:
            $ref: '#/components/schemas/dropshipment_get_order_status_product_object'
        carrier:
          type: string
          description: Carrier. *(Only if order has been shipped)*
          example: UPS Parcel
        carrier_service:
          type: string
          description: Carrier service. *(Only if order has been shipped)*
          example: Next Day Air
        tracking_number:
          type: string
          description: Tracking number. *(Only if order has been shipped)*
          example: 1ZY1111111
        parcel_status:
          type: string
          description: 'Status of the parcel. *(Only if order has been shipped)* Value can be:



            | Value|

            |---|

            |pending|

            |info_received|

            |in_transit|

            |failed_attempt|

            |exception|

            |delayed|

            |pickup|

            |delivered|

            |return|

            |expired|

            '
          example: in_transit
        ship_date:
          type: string
          description: 'Date on which the order was shipped (format: YYYY-MM-DD).'
          example: '2024-03-15'
        is_replacement:
          type: boolean
          description: Indicates whether this order is a replacement for a previous order.
        original_customer_ref:
          type: string
          description: The customer reference of the original order this replacement was created for.
          example: MOUVEMENTREFERENCE00000001
    dropshipment_get_order_status_product_device_object:
